# ---------------------------------------------------------------------------
# Not installable from this file. Install after the environment exists:
#
#   1. torch, from the cu124 index rather than PyPI:
#        pip install torch==2.6.0 torchvision==0.21.0 \
#            --index-url https://download.pytorch.org/whl/cu124
#      torch-cluster==1.6.3+pt26cu124 and torch-scatter==2.1.2+pt26cu124 come
#      from https://data.pyg.org/whl/torch-2.6.0+cu124.html the same way.
#
#   2. a matching CUDA toolkit inside the env, so nvcc can target your GPU:
#        conda install -c nvidia/label/cuda-12.4.1 cuda-toolkit
#        export CUDA_HOME=$CONDA_PREFIX
#
#   3. flash-attn — REQUIRED: the shape generator raises without it, because the
#      `sdpa` path falls back to math attention under the determinism contract
#      and costs 2.6x end to end for bit-identical output. Set
#      T2S_ATTN_IMPL=sdpa to accept that cost deliberately.
#      Its setup.py imports torch, so it needs torch present and
#      build isolation off. MAX_JOBS too high and the OOM killer takes it:
#        TORCH_CUDA_ARCH_LIST='8.0;8.6;8.9+PTX' MAX_JOBS=4 \
#            pip install flash-attn==2.6.3 --no-build-isolation
#
#   4. three packages installed from git, pinned by commit — the versions they
#      self-report do not identify a release:
#        cubvh @ git+https://github.com/ashawkey/cubvh@757b913bfbf19ed65e3a379d159391a8e29efa0f
#        nvdiffrast @ git+https://github.com/NVlabs/nvdiffrast.git@729261dc64c4241ea36efda84fbf532cc8b425b8
#        pointops @ git+https://github.com/Pointcept/Pointcept.git@9f37497e4f3005c90bbbe7221b86439c29d60611#subdirectory=libs/pointops
#      install them with --no-build-isolation.
# ---------------------------------------------------------------------------
